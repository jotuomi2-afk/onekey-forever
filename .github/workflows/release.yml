name: release

# A tag v1.2.3 whose number matches "## Version" in the toc builds the zip,
# runs every check again and publishes a GitHub release with the zip and its
# SHA-256. Nothing else in the repository can publish.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release        # protect it in Settings → Environments (required reviewer)
    permissions:
      contents: write           # only to create the release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r tests/requirements.txt
      - name: Tag matches the toc version
        run: |
          v=$(sed -n 's/^## Version: *//p' OneKeyDruid/OneKeyDruid.toc | tr -d '\r')
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but toc says $v"; exit 1; }
      - run: python3 -I tests/run_tests.py
      - run: python3 -I tests/mutation_check.py
      - run: python3 -I tests/fuzz_test.py --runs 500
      - run: OKD_COVERAGE=1 python3 -I tests/run_tests.py --min-coverage 65
      - run: python3 -I security/scan.py
      - run: python3 -I tools/build.py --no-test
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## "v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "OneKey Forever $v" > notes.md
      # A release a person already published for this tag (from the Releases
      # page) gets the files and stays published; otherwise a draft is made
      # for a person to check and publish. (The action used before turned a
      # published release back into a draft.)
      - name: Attach to the release, or make a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=$(ls dist/OneKeyForever-*.zip dist/OneKeyForever-*.zip.sha256)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $files --draft --title "OneKey Forever ${TAG#v}" \
              --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          fi
