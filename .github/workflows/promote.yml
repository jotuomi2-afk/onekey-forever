name: promote

# From beta to release. release/STABLE names the version that is the stable
# one; a commit on main that changes it turns that pre-release into the
# latest release on GitHub and uploads the same zip to CurseForge as a
# release. Nothing is built here: the zip is the one that was tested as a
# beta, checked against its SHA-256. The rule for changing the file is in
# docs/RELEASE.md ("From beta to release").
on:
  push:
    branches: [main]
    paths: ["release/STABLE"]

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write           # only to edit the release
    outputs:
      tag: ${{ steps.do.outputs.tag }}
      done: ${{ steps.do.outputs.done }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: do
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d ' \r\n' < release/STABLE)
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "release/STABLE must hold one version number"; exit 1; }
          tag="v$v"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          state=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '[.draft, .prerelease] | @tsv') \
            || { echo "no release $tag"; exit 1; }
          if [ "$state" = "$(printf 'false\tfalse')" ]; then
            echo "$tag is a release already: nothing to do."
            echo "done=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          test "$state" = "$(printf 'false\ttrue')" || { echo "$tag is not a published pre-release"; exit 1; }
          # only forwards: never back to a version below the latest release
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null | sed 's/^v//' || true)
          top=$(printf '%s\n%s\n' "$latest" "$v" | sort -V | tail -1)
          test "$top" = "$v" || { echo "$v is below the latest release $latest"; exit 1; }
          # the evidence must be in the repository, for this version
          grep -Fxq "## $v: enough for a release" release/FIELD.md || { echo "release/FIELD.md does not say that $v has enough play behind it"; exit 1; }
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "OneKeyForever-$v.zip" --pattern "OneKeyForever-$v.zip.sha256"
          sha256sum -c "OneKeyForever-$v.zip.sha256"
          gh release edit "$tag" --prerelease=false --latest --repo "$GITHUB_REPOSITORY"
          echo "done=1" >> "$GITHUB_OUTPUT"

  curseforge:
    needs: promote
    if: needs.promote.outputs.done == '1'
    uses: ./.github/workflows/curseforge.yml
    with:
      tag: ${{ needs.promote.outputs.tag }}
      prerelease: false
    secrets: inherit
